<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' peon-asset:; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' peon-asset:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-app-region: drag; }
    #wrapper {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #pet-area {
      flex-shrink: 0;
      position: relative;
    }
    canvas { display: block; -webkit-app-region: drag; }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(8, 8, 16, 0.88);
      color: #bbb;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }
    #sessions-sidebar {
      display: none;
      flex: 1;
      min-width: 0;
      background: rgba(12, 12, 20, 0.88);
      border-left: 1px solid rgba(139, 105, 20, 0.3);
      padding: 8px 10px;
      overflow-y: auto;
      font-family: 'SF Mono', Consolas, 'Courier New', monospace;
      font-size: 11px;
      color: #ccc;
      -webkit-app-region: drag;
    }
    #sessions-sidebar.visible { display: block; }
    #sessions-sidebar::-webkit-scrollbar { width: 4px; }
    #sessions-sidebar::-webkit-scrollbar-track { background: transparent; }
    #sessions-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .section-label {
      font-size: 9px;
      color: #8b7530;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 6px 0 3px 0;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(139, 105, 20, 0.2);
    }
    .section-label:first-child { margin-top: 0; }
    .session-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      white-space: nowrap;
    }
    .sdot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sdot.running { background: #44ff44; box-shadow: 0 0 4px #44ff44; }
    .sdot.idle    { background: #ddaa00; }
    .sdot.ended   { background: #444; }
    .session-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #bbb;
    }
    .session-time {
      color: #666;
      font-size: 10px;
      flex-shrink: 0;
    }
    .sessions-empty {
      color: #555;
      font-style: italic;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="pet-area">
      <canvas id="c"></canvas>
      <div id="tooltip"></div>
    </div>
    <div id="sessions-sidebar"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
