<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' peon-asset:; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' peon-asset:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-app-region: drag; }

    #wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 18, 0.92);
      border-radius: 10px;
      overflow: hidden;
    }

    /* --- Pet area (left) --- */
    #pet-area {
      flex-shrink: 0;
      position: relative;
      width: var(--pet-size);
      height: 100%;
      padding: 6px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      clip-path: inset(0 round 8px);
      -webkit-app-region: drag;
    }

    #tooltip {
      position: absolute;
      display: none;
      background: rgba(8, 8, 16, 0.92);
      color: #bbb;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }

    /* --- Sessions sidebar (right) --- */
    #sessions-sidebar {
      display: none;
      flex: 1;
      min-width: 0;
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      overflow-y: auto;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: #9a9aaa;
      -webkit-app-region: drag;
    }
    #sessions-sidebar.visible {
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    #sessions-sidebar::-webkit-scrollbar { width: 3px; }
    #sessions-sidebar::-webkit-scrollbar-track { background: transparent; }
    #sessions-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Section headers */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 10px 0 4px 0;
    }
    .section-label:first-child { margin-top: 2px; }

    /* Session rows */
    .session-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      margin: 1px 0;
      border-radius: 5px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    /* Status dots */
    .sdot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sdot.running {
      background: #34d399;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .sdot.idle { background: #f59e0b; opacity: 0.8; }
    .sdot.ended { background: rgba(255, 255, 255, 0.15); }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 4px rgba(52, 211, 153, 0.4); }
      50% { box-shadow: 0 0 8px rgba(52, 211, 153, 0.7); }
    }

    .session-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 500;
    }
    .session-row .session-name.running-name { color: rgba(255, 255, 255, 0.88); }
    .session-row .session-name.ended-name { color: rgba(255, 255, 255, 0.3); }

    .session-time {
      color: rgba(255, 255, 255, 0.25);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .sessions-empty {
      color: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      padding: 8px 0;
    }

    /* Spacer pushes content up */
    .sidebar-spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="pet-area">
      <canvas id="c"></canvas>
      <div id="tooltip"></div>
    </div>
    <div id="sessions-sidebar"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
